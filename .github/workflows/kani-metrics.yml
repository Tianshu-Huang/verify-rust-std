name: Kani Metrics Update

on:
  schedule:
    - cron: '0 0 * * 0'  # Run at 00:00 UTC every Sunday
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  update-kani-metrics:
    permissions:
      actions: read # to download the autoharness results of the last merge queue run
      contents: write
      pull-requests: write
    if: github.repository == 'model-checking/verify-rust-std'
    runs-on: ubuntu-24.04
    
    steps:
    - name: Remove unnecessary software to free up disk space
      run: |
        # inspired by https://github.com/easimon/maximize-build-space/blob/master/action.yml
        df -h
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup
        df -h

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true
    
    # The Kani metrics collection uses a Python script (kani_std_analysis.py), so make sure Python is installed
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Compute Kani Metrics
      run: |
        ./scripts/run-kani.sh --run metrics --with-autoharness --path ${{github.workspace}}
        rm kani-list.json

    # One point per week for the chart in the "Autoharness status" issue. The analyzer takes about
    # an hour, so take the numbers of the last merge queue run instead of running it again.
    # A failure here must not stop the metrics update below. matplotlib is installed by
    # run-kani.sh above.
    - name: Record autoharness history
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        run=$(gh run list --workflow kani.yml --event merge_group --status success --limit 1 \
          --json databaseId --jq '.[0].databaseId // empty') || true
        if [ -n "$run" ] && gh run download "$run" --name autoharness-coverage --dir coverage \
            && gh run download "$run" --name ubuntu-latest-results.json --dir results; then
          { python3 scripts/kani-std-analysis/autoharness_history.py record coverage results/results.json \
            && python3 scripts/kani-std-analysis/autoharness_history.py plot; } \
            || echo "Could not update the autoharness history."
        else
          echo "No merge queue run with autoharness results found; the history is unchanged."
        fi
        rm -rf coverage results

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: Update Kani metrics
        title: 'Update Kani Metrics'
        body: |
          This is an automated PR to update Kani metrics.
          
          The metrics have been updated by running `./scripts/run-kani.sh --run metrics`.
        branch: update-kani-metrics
        delete-branch: true
        base: main
